name: Sync Space UI to Hugging Face

on:
  push:
    branches: [main]
    paths:
      - "docs/hf_space_static/**"
      - ".github/workflows/sync-hf-space.yml"
  workflow_dispatch:

jobs:
  sync-space-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install huggingface_hub
        run: pip install -U "huggingface_hub>=0.26.0"

      - name: Upload Space UI without deleting models
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from huggingface_hub import HfApi

          token = os.environ.get("HF_TOKEN")
          if not token:
              raise SystemExit("HF_TOKEN secret is missing")

          folder = Path("docs/hf_space_static")
          if not folder.is_dir():
              raise SystemExit(f"missing {folder}")

          api = HfApi(token=token)
          # Upload UI files only. Do not use delete_patterns — the Space hosts
          # /models/urdu-headline/ ONNX weights that are not in this git folder.
          api.upload_folder(
              folder_path=str(folder),
              repo_id="HammadHARahim/infinitic-urdu-headline-classifier",
              repo_type="space",
              commit_message="Sync Space UI from GitHub",
          )
          print("Synced docs/hf_space_static -> Space (models preserved)")
          PY
